<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero">
      <nav>
        <div class="logo">
          <span>MINECRAFT</span>
        </div>
        <ul class="links">
          <li class="home a">Home</li>
          <li class="biomes b">Biomes</li>
          <li class="mobs c">Mobs</li>
          <li class="minecraft d">Minecraft</li>
        </ul>
      </nav>
      <video
        class="hero-video"
        autoplay
        loop
        muted
        playsinline
        src="static/minecraft-hero.mp4"
      ></video>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <p class="hero-subtitle">the only limit is your imagination.</p>
        <h1 class="hero-title">MINECRAFT</h1>
      </div>
    </section>
    <section class="gallery-1">
      <div class="overlay-top"></div>
      <div class="overlay-bottom"></div>
    </section>
    <section class="gallery-2">
      <div class="overlay-top"></div>
      <div class="overlay-bottom"></div>
    </section>
  </body>
</html>
